name: Test PlantUML/GraphViz
on:
  push:
  workflow_dispatch:
jobs:
  build-fix-graphviz:
    name: "Test avec fix-graphviz-version (GraphViz 14.1.5)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: igSource
      - uses: ansforge/IG-workflows@fix-graphviz-version
        with:
          repo_ig: "./igSource"
          github_page: "true"
          github_page_token: ${{ secrets.GITHUB_TOKEN }}
          bake: "false"
          validator_cli: "false"
          generate_testscript: "false"
          generate_plantuml: "false"
